<rect x="40" y="70" width="600" height="300" rx="24" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
<text class="sub" x="470" y="84" text-anchor="start" fill="#777">Optional: AgentCore</text>

<rect class="box" x="60" y="90" width="560" height="250" rx="20" fill="#e6f4f4" stroke="#2a9d8f"/>
<text class="title" x="80" y="118">Job application agent</text>
