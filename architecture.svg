<rect class="box" x="350" y="155" width="230" height="60" rx="10" fill="#e8f0fb" stroke="#4a7fc9"/>
<text class="title" x="465" y="176" text-anchor="middle">Fit scorer tool</text>
<text class="sub" x="465" y="196" text-anchor="middle">Scores fit vs resume</text>

<rect class="box" x="90" y="235" width="230" height="60" rx="10" fill="#fbe9e5" stroke="#d97757"/>
<text class="title" x="205" y="256" text-anchor="middle">Drafter tool</text>
<text class="sub" x="205" y="276" text-anchor="middle">Drafts tailored materials</text>

