<line x1="340" y1="370" x2="340" y2="388" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
<rect class="box" x="220" y="390" width="240" height="50" rx="10" fill="#fdf1dc" stroke="#c98a1f"/>
<text class="title" x="340" y="408" text-anchor="middle">Surfaces for your call</text>
<text class="sub" x="340" y="426" text-anchor="middle">Borderline fits &amp; odd asks</text>

