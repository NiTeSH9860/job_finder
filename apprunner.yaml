version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  runtime-version: 3.11
  command: uvicorn web.app:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
    env: PORT
  env:
    - name: ADZUNA_APP_ID
      value: ""
    - name: ADZUNA_APP_KEY
      value: ""
    - name: GOOGLE_API_KEY
      value: ""